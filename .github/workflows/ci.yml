name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    # lyrical (rp1's actual dev/target distro -- see rp1/CLAUDE.md) pairs with 26.04.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/vesc_dronecan_ros

      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: lyrical

      # Explicit rosdep/colcon steps instead of ros-tooling/action-ros-ci: that action
      # internally re-clones the checked-out repo over unauthenticated HTTPS to diff it, which
      # fails for a private repo ("Could not read Username for 'https://github.com'") -- no
      # token input exists for that internal step.
      - name: rosdep install
        run: |
          sudo rosdep init || true
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y

      - name: colcon build
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon build --symlink-install

      - name: colcon test
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon test
          colcon test-result --verbose
